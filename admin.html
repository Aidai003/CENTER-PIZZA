<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Pizza Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #f97316;
            --text: #f8fafc;
            --text-dim: #94a3b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .admin-container { max-width: 1000px; margin: 0 auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .logo { font-size: 24px; font-weight: 800; color: var(--accent); }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 10px; }
        .tab { padding: 10px 20px; background: var(--card); border-radius: 10px; cursor: pointer; transition: 0.3s; white-space: nowrap; }
        .tab.active { background: var(--accent); }
        
        .section { display: none; }
        .section.active { display: block; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .item-card { background: var(--card); border-radius: 15px; overflow: hidden; position: relative; }
        .item-card img { width: 100%; height: 150px; object-fit: cover; }
        .item-info { padding: 15px; }
        .item-info h3 { font-size: 16px; margin-bottom: 5px; }
        .item-info p { color: var(--accent); font-weight: 700; }
        
        .btn-add { background: var(--accent); color: white; border: none; padding: 15px 30px; border-radius: 12px; font-weight: 700; cursor: pointer; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--card); padding: 30px; border-radius: 20px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 15px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: white; outline: none; }
        button { width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; }
        
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 2000; display: flex; justify-content: center; align-items: center; }
        
        .btn-action { width: auto; padding: 5px 10px; font-size: 12px; background: rgba(255,255,255,0.1); }
        .btn-del { color: #ef4444; }
        
        .table-marker { position: absolute; width: 25px; height: 25px; background: var(--accent); border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; cursor: move; }

        .loader { width: 20px; height: 20px; border: 2px solid #FFF; border-bottom-color: transparent; border-radius: 50%; display: inline-block; box-sizing: border-box; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="login-overlay">
        <div style="background: var(--card); padding: 40px; border-radius: 20px; text-align: center; width: 300px;">
            <h2 style="margin-bottom: 20px;">Admin Login</h2>
            <input type="password" id="admin-pass" placeholder="Password">
            <button onclick="login()" style="background: var(--accent); color: white;">Login</button>
        </div>
    </div>

    <div class="admin-container">
        <header>
            <div class="logo">PIZZA ADMIN</div>
            <button onclick="exportData()" style="width: auto; background: var(--card); font-size: 12px;">Backup JSON</button>
        </header>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('menu', this)">Меню</div>
            <div class="tab" onclick="switchTab('stories', this)">Сторис</div>
            <div class="tab" onclick="switchTab('scheme', this)">Схема зала</div>
            <div class="tab" onclick="switchTab('quotes', this)">Цитаты</div>
            <div class="tab" onclick="switchTab('orders', this)">Заказы</div>
            <div class="tab" onclick="switchTab('settings', this)">Настройки</div>
        </div>

        <!-- Menu Section -->
        <div id="menu-section" class="section active">
            <button class="btn-add" onclick="openModal('item')"><i data-lucide="plus"></i> Добавить блюдо</button>
            <div class="grid" id="menu-grid"></div>
        </div>

        <!-- Stories Section -->
        <div id="stories-section" class="section">
            <button class="btn-add" onclick="openModal('story')"><i data-lucide="plus"></i> Добавить историю</button>
            <div class="grid" id="stories-grid"></div>
        </div>

        <!-- Quotes Section -->
        <div id="quotes-section" class="section">
            <div style="background: var(--card); padding: 20px; border-radius: 20px; margin-bottom: 20px;">
                <h3>Добавить цитату</h3>
                <textarea id="new-quote-text" placeholder="Введите текст цитаты..." rows="3" style="margin-top: 15px;"></textarea>
                <button onclick="addQuote()" style="background: var(--accent); color: white;">Добавить</button>
            </div>
            <div id="quotes-list" class="grid"></div>
        </div>

        <!-- Orders Section -->
        <div id="orders-section" class="section">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h2>История заказов</h2>
                <button onclick="clearOrders()" style="width:auto; background:#ef4444; color:white;">Очистить все</button>
            </div>
            <div id="orders-list" class="grid"></div>
        </div>

        <!-- Scheme Section -->
        <div id="scheme-section" class="section">
            <div style="background: var(--card); padding: 20px; border-radius: 20px; margin-bottom: 20px;">
                <h3>Загрузить фото зала</h3>
                <input type="file" onchange="handleFileUpload(this, 'scheme')" style="margin-top: 10px;">
                <p style="font-size: 12px; color: var(--text-dim); margin-top: 10px;">* Нажмите на фото, чтобы добавить стол</p>
            </div>
            <div id="scheme-editor" style="position: relative; width: 100%; background: #000; border-radius: 20px; overflow: hidden;">
                <img id="scheme-img-preview" src="" style="width: 100%; display: block; min-height: 300px;">
                <div id="scheme-markers-container"></div>
            </div>
            <button onclick="saveScheme()" style="background: var(--accent); color: white; margin-top: 20px;">Сохранить схему</button>
        </div>

        <!-- Settings Section -->
        <div id="settings-section" class="section">
            <div style="background: var(--card); padding: 20px; border-radius: 20px;">
                <h3>Настройки WhatsApp</h3>
                <label style="display:block; margin: 15px 0 5px; font-size: 14px;">Номер телефона для заказов (с кодом страны, без +)</label>
                <input type="text" id="admin-phone" placeholder="996555123456">
                <button onclick="saveSettings()" style="background: var(--accent); color: white;">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="item-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title" style="margin-bottom: 20px;">Новое блюдо</h2>
            <div id="modal-img-preview" style="width: 100%; height: 200px; border-radius: 15px; background: rgba(0,0,0,0.2); margin-bottom: 20px; display: flex; justify-content: center; align-items: center; overflow: hidden; border: 1px dashed rgba(255,255,255,0.1);">
                <span style="color:var(--text-dim); font-size:14px;">Предпросмотр фото</span>
            </div>
            <input type="text" id="item-name" placeholder="Название">
            <input type="text" id="item-desc" placeholder="Описание">
            <input type="text" id="item-price" placeholder="Цена">
            <input type="text" id="item-img" placeholder="URL картинки" oninput="updatePreview(this.value)">
            <div style="margin-bottom:20px;">
                <label style="display:block; margin-bottom:10px; font-size:14px; color:var(--text-dim);">Или загрузить фото:</label>
                <input type="file" id="item-file" accept="image/*" onchange="handleFileUpload(this)">
            </div>
            <select id="item-cat">
                <option value="first">Первые блюда</option>
                <option value="second">Вторые блюда</option>
                <option value="drinks">Напитки</option>
                <option value="desserts">Десерты</option>
                <option value="snacks">Закуски</option>
            </select>
            <div style="display:flex; gap:10px;">
                <button style="background: #334155; color: white;" onclick="closeModal()">Отмена</button>
                <button id="save-item-btn" onclick="saveItem()" style="background: var(--accent); color: white;">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ihzeeilfmbgsddzcyywp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImloemVlaWxmbWJnc2RkemN5eXdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzMTU4NzMsImV4cCI6MjA5Mzg5MTg3M30.nv3DvgcgxHvk1J_W0U5o94LWY5w8nAcZTyAg92mz77M';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let menu = [];
        let stories = [];
        let quotes = [];
        let orders = [];
        let editingId = null;
        let modalType = 'item';

        async function login() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === 'admin') {
                document.getElementById('login-overlay').style.display = 'none';
                await refreshAll();
            } else {
                alert('Неверный пароль');
            }
        }

        async function refreshAll() {
            try {
                const { data: menuData } = await supabase.from('menu').select('*').order('id', { ascending: true });
                const { data: storyData } = await supabase.from('stories').select('*').order('id', { ascending: true });
                const { data: quoteData } = await supabase.from('quotes').select('*').order('id', { ascending: true });
                const { data: orderData } = await supabase.from('orders').select('*').order('created_at', { ascending: false });

                menu = menuData || [];
                stories = storyData || [];
                quotes = quoteData || [];
                orders = orderData || [];

                renderMenu();
                renderStories();
                renderQuotes();
                renderOrders();
                initScheme();
                loadSettings();
            } catch (e) {
                console.error(e);
            }
        }

        function switchTab(tab, el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(tab + '-section').classList.add('active');
        }

        function renderMenu() {
            const grid = document.getElementById('menu-grid');
            grid.innerHTML = '';
            menu.forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <img src="${item.image_url}">
                    <div class="item-info">
                        <h3>${item.name}</h3>
                        <p>${item.price} с.</p>
                        <div style="display:flex; gap:10px; margin-top:10px;">
                            <button class="btn-action" onclick="openModal('item', ${item.id})"><i data-lucide="edit-3"></i></button>
                            <button class="btn-action btn-del" onclick="deleteItem('menu', ${item.id})"><i data-lucide="trash-2"></i></button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        function renderStories() {
            const grid = document.getElementById('stories-grid');
            grid.innerHTML = '';
            stories.forEach(s => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <img src="${s.image_url}">
                    <div class="item-info">
                        <h3>${s.title}</h3>
                        <div style="display:flex; gap:10px; margin-top:10px;">
                            <button class="btn-action" onclick="openModal('story', ${s.id})"><i data-lucide="edit-3"></i></button>
                            <button class="btn-action btn-del" onclick="deleteItem('stories', ${s.id})"><i data-lucide="trash-2"></i></button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        function openModal(type, id = null) {
            modalType = type;
            editingId = id;
            const modal = document.getElementById('item-modal');
            const title = document.getElementById('modal-title');
            modal.style.display = 'flex';

            if (type === 'item') {
                title.innerText = id ? 'Редактировать блюдо' : 'Новое блюдо';
                document.getElementById('item-cat').style.display = 'block';
                document.getElementById('item-price').style.display = 'block';
                document.getElementById('item-desc').style.display = 'block';
                if (id) {
                    const item = menu.find(m => m.id === id);
                    document.getElementById('item-name').value = item.name;
                    document.getElementById('item-desc').value = item.description;
                    document.getElementById('item-price').value = item.price;
                    document.getElementById('item-img').value = item.image_url;
                    document.getElementById('item-cat').value = item.category;
                    updatePreview(item.image_url);
                } else {
                    resetModal();
                }
            } else {
                title.innerText = id ? 'Редактировать историю' : 'Новая история';
                document.getElementById('item-cat').style.display = 'none';
                document.getElementById('item-price').style.display = 'none';
                document.getElementById('item-desc').style.display = 'none';
                if (id) {
                    const s = stories.find(st => st.id === id);
                    document.getElementById('item-name').value = s.title;
                    document.getElementById('item-img').value = s.image_url;
                    updatePreview(s.image_url);
                } else {
                    resetModal();
                }
            }
        }

        function resetModal() {
            document.getElementById('item-name').value = '';
            document.getElementById('item-desc').value = '';
            document.getElementById('item-price').value = '';
            document.getElementById('item-img').value = '';
            document.getElementById('modal-img-preview').innerHTML = '<span>Предпросмотр фото</span>';
        }

        function closeModal() {
            document.getElementById('item-modal').style.display = 'none';
        }

        function updatePreview(url) {
            const prev = document.getElementById('modal-img-preview');
            if (url) prev.innerHTML = `<img src="${url}" style="width:100%; height:100%; object-fit:cover;">`;
            else prev.innerHTML = '<span>Предпросмотр фото</span>';
        }

        async function saveItem() {
            const name = document.getElementById('item-name').value;
            const img = document.getElementById('item-img').value;
            
            if (modalType === 'item') {
                const desc = document.getElementById('item-desc').value;
                const price = document.getElementById('item-price').value;
                const cat = document.getElementById('item-cat').value;
                const item = { name, description: desc, price, image_url: img, category: cat };
                
                if (editingId) await supabase.from('menu').update(item).eq('id', editingId);
                else await supabase.from('menu').insert([item]);
            } else {
                const story = { title: name, image_url: img };
                if (editingId) await supabase.from('stories').update(story).eq('id', editingId);
                else await supabase.from('stories').insert([story]);
            }
            closeModal();
            refreshAll();
        }

        async function deleteItem(table, id) {
            if (confirm('Удалить?')) {
                await supabase.from(table).delete().eq('id', id);
                refreshAll();
            }
        }

        // Scheme Logic
        let schemeData = { image: '', tables: [] };
        async function initScheme() {
            const { data } = await supabase.from('scheme').select('*').eq('id', 1).single();
            if (data) {
                schemeData = data;
                document.getElementById('scheme-img-preview').src = data.image || '';
                renderSchemeMarkers();
            }
        }

        async function saveScheme() {
            await supabase.from('scheme').upsert({ id: 1, ...schemeData });
            alert('Схема сохранена!');
        }

        function renderSchemeMarkers() {
            const container = document.getElementById('scheme-markers-container');
            container.innerHTML = '';
            schemeData.tables.forEach((t, i) => {
                const m = document.createElement('div');
                m.className = 'table-marker';
                m.style.left = t.x + '%'; m.style.top = t.y + '%';
                m.innerText = t.num;
                m.onclick = (e) => { e.stopPropagation(); if (confirm('Удалить стол?')) { schemeData.tables.splice(i, 1); renderSchemeMarkers(); } };
                container.appendChild(m);
            });
        }

        document.getElementById('scheme-img-preview').onclick = (e) => {
            if (!schemeData.image) return alert('Сначала загрузите фото зала');
            const rect = e.target.getBoundingClientRect();
            const x = ((e.clientX - rect.left) / rect.width) * 100;
            const y = ((e.clientY - rect.top) / rect.height) * 100;
            const num = prompt('Номер стола:');
            if (num) {
                schemeData.tables.push({ num, x: x.toFixed(2), y: y.toFixed(2) });
                renderSchemeMarkers();
            }
        };

        async function handleFileUpload(input, type = 'item') {
            const file = input.files[0];
            if (!file) return;
            const path = `uploads/${Date.now()}_${file.name}`;
            const { data, error } = await supabase.storage.from('images').upload(path, file);
            if (error) return alert(error.message);
            const { data: { publicUrl } } = supabase.storage.from('images').getPublicUrl(path);
            if (type === 'scheme') {
                schemeData.image = publicUrl;
                document.getElementById('scheme-img-preview').src = publicUrl;
            } else {
                document.getElementById('item-img').value = publicUrl;
                updatePreview(publicUrl);
            }
        }

        // Quotes
        function renderQuotes() {
            const list = document.getElementById('quotes-list');
            list.innerHTML = '';
            quotes.forEach(q => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.style.padding = '15px';
                card.innerHTML = `<p style="font-style:italic; margin-bottom:10px;">"${q.text}"</p><button class="btn-action btn-del" onclick="deleteQuote(${q.id})">Удалить</button>`;
                list.appendChild(card);
            });
        }

        async function addQuote() {
            const text = document.getElementById('new-quote-text').value.trim();
            if (text) {
                await supabase.from('quotes').insert([{ text }]);
                document.getElementById('new-quote-text').value = '';
                refreshAll();
            }
        }

        async function deleteQuote(id) {
            if (confirm('Удалить цитату?')) {
                await supabase.from('quotes').delete().eq('id', id);
                refreshAll();
            }
        }

        function renderOrders() {
            const list = document.getElementById('orders-list');
            list.innerHTML = '';
            orders.forEach(o => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.style.padding = '15px';
                card.innerHTML = `<h4>${o.user}</h4><p style="font-size:12px; margin:5px 0;">${o.items}</p><p><b>${o.total} с.</b></p><small style="color:var(--text-dim);">${new Date(o.created_at).toLocaleString()}</small>`;
                list.appendChild(card);
            });
        }

        async function clearOrders() {
            if (confirm('Очистить историю?')) {
                await supabase.from('orders').delete().neq('id', 0);
                refreshAll();
            }
        }

        async function saveSettings() {
            const phone = document.getElementById('admin-phone').value;
            await supabase.from('settings').upsert({ key: 'admin_phone', value: phone }, { onConflict: 'key' });
            alert('Настройки сохранены!');
        }

        async function loadSettings() {
            const { data } = await supabase.from('settings').select('*').eq('key', 'admin_phone').single();
            if (data) document.getElementById('admin-phone').value = data.value;
        }

        function exportData() {
            const data = { menu, stories, quotes, scheme: schemeData };
            const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `center_pizza_supabase_backup_${new Date().toLocaleDateString()}.json`;
            a.click();
        }
    </script>
</body>
</html>
